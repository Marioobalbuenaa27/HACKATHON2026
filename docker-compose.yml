services:
  db:
    image: postgres:16-alpine
    container_name: turnero-jp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: turnero
      POSTGRES_PASSWORD: turnero
      POSTGRES_DB: turnero_jp
    ports:
      - "5432:5432"
    volumes:
      - turnero_jp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U turnero -d turnero_jp"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  turnero_jp_pgdata:
